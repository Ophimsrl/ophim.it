[project]
name = "csv-data-analyst"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
    "mistralai-agents[bashkit,sessions-client,koyeb]==1.1.3",
    "pandas>=3.1.1",
]

# The project is a workspace of its own, so `uv lock` writes its uv.lock here even inside another
# uv workspace, such as a monorepo checkout.
[tool.uv.workspace]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]
